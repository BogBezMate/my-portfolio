name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Приветствие
        run: echo "Привет из GitHub Actions!"
      - name: Проверка HTML
        run: |
          echo "Файлы в репозитории:"
          ls -la
          test -f index.html && echo "index.html найден"
          echo "Проверка завершена"
